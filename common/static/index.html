<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Helpdesk Copilot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">Brightkettle Helpdesk Copilot</div>
    <div id="banner" class="banner"></div>
    <div id="customer" class="customer"></div>
  </header>
  <main>
    <section id="messages" class="messages" aria-live="polite"></section>
    <form id="chat-form" class="chat-form">
      <input id="message" name="message" autocomplete="off" placeholder="Ask about an order, a refund or a product">
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="/static/chat.js"></script>
</body>
</html>
