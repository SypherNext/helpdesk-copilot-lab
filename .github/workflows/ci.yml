name: security tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The tests use a scripted fake model, so no Ollama, Docker or network is needed.
      - name: Every security test passes on the fixed app
        run: python -m pytest tests --app fixed -q
      - name: Every security test still fails on the vulnerable app
        run: |
          if python -m pytest tests --app vulnerable -q; then
            echo "The vulnerable app passed a security test: a flaw was fixed in the wrong copy."
            exit 1
          fi
          echo "As expected, the vulnerable app fails the security tests."
      - name: The steps copies pass the tests for the fixes they contain
        run: |
          python -m pytest tests --app steps/15-checks-in-and-out/fixed -q -k "L06_leaked or L09_image or L11 or L15"
          python -m pytest tests --app steps/16-safer-design/fixed -q
